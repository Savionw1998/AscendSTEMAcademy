<title>STEM-a-lotl Rescue Lab</title>
<style>body{margin:0;background:#ffffff;color:#24332a;font-family:Roboto,Arial,sans-serif;}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
/* STEM-a-lotl: Rescue Lab. Scoped under .rl-root / #rl-game and .rl-overlay.
   Shell, type and palette follow the Ascend Axolotl Games plugin (Guess-a-lotl,
   Cross-a-lotl): Roboto body, 'Baloo 2' titles, blue #009CDE / #045C82,
   green #1D4010 / #BFE0B4, pink #E07FA3, stat pills, dashed "How to play" toggle,
   pale-blue tip boxes, reduced-motion support. */
#rl-game,.rl-overlay{--blue:#009CDE;--dblue:#045C82;--navy:#173e63;--green:#1D4010;--lgreen:#BFE0B4;--pink:#F5B9CF;--dpink:#E07FA3;--ink:#24332a;--muted:#5f656a;--line:#e4e1da;--soft:#eef6fb;--softline:#d4e7f2;--sand:#f4f2ec;--gold:#ffd166;}
.rl-overlay{font-family:Roboto,Arial,sans-serif;line-height:1.45;}
.rl-overlay *{box-sizing:border-box;}
.rl-overlay button{font-family:inherit;}
#rl-game{max-width:760px;margin:0 auto;padding:22px 16px 50px;font-family:Roboto,Arial,sans-serif;color:var(--ink);line-height:1.45;font-size:15px;-webkit-text-size-adjust:100%;}
#rl-game *{box-sizing:border-box;}
#rl-game button{font-family:inherit;}
#rl-game [hidden],.rl-overlay [hidden]{display:none!important;}

/* header, like the other axolotl games */
.rl-head{text-align:center;}
.rl-mascot{margin-bottom:4px;}
.rl-mascot img{max-width:110px;width:100%;height:auto;}
.rl-title{font-size:clamp(28px,5vw,40px);margin:0;color:var(--navy);font-weight:700;font-family:'Baloo 2',Roboto,Arial,sans-serif;line-height:1.1;}
.rl-subtitle{color:var(--muted);margin:6px 0 14px;font-size:15px;}
.rl-stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.rl-stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 14px;font-size:14px;font-variant-numeric:tabular-nums;}
.rl-stat strong{color:var(--blue);}
.rl-toggle-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;}
.rl-toggle{background:transparent;border:1px dashed #c9c5b8;border-radius:8px;padding:8px 14px;font-size:12px;color:#6d6656;cursor:pointer;min-height:36px;}
.rl-toggle:hover{border-color:#999;color:#444;}
.rl-toggle[aria-pressed="true"]{border-style:solid;border-color:var(--blue);color:var(--dblue);background:var(--soft);}
.rl-instructions{margin-top:10px;background:var(--soft);border:1px solid var(--softline);border-radius:12px;padding:14px 16px;font-size:13px;}
.rl-instructions p{margin:0 0 8px;} .rl-instructions p:last-child{margin:0;}
.rl-live{text-align:center;font-size:13px;color:#1474aa;margin:10px 0;min-height:18px;}
.rl-notice{margin:10px 0;border-radius:12px;padding:10px 14px;background:#fff8e1;border:1px solid #f3dd9a;color:#5b4700;font-size:13px;}
.rl-notice a{color:#5b4700;font-weight:700;}
.rl-fine{font-size:12px;color:var(--muted);}

/* buttons */
.rl-btn{border-radius:12px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;background:#fff;color:var(--ink);border:1px solid var(--line);min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;}
.rl-btn:hover{border-color:var(--blue);}
.rl-btn:focus-visible,.rl-toggle:focus-visible,.rl-level:focus-visible,.rl-tray-btn:focus-visible,.rl-skin:focus-visible,.rl-scene:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
.rl-btn:disabled{opacity:.45;cursor:default;}
.rl-btn.primary{background:var(--dpink);color:#fff;border-color:var(--dpink);}
.rl-btn.primary:hover{background:#c9678b;}
.rl-btn.blue{background:var(--blue);color:#fff;border-color:var(--blue);}
.rl-btn.blue:hover{background:var(--dblue);}
.rl-btn.pass{background:var(--dblue);color:#fff;border-color:var(--dblue);}
.rl-btn.pass:hover{background:var(--blue);}
.rl-btn.big{font-size:16px;padding:13px 26px;border-radius:14px;}
.rl-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0;}
.rl-row.left{justify-content:flex-start;}

/* map: hero */
.rl-hero{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:16px;align-items:center;background:linear-gradient(135deg,#eaf6fc,#fdf0f5);border:1px solid var(--softline);border-radius:18px;padding:14px;margin:4px 0 10px;}
.rl-hero-canvas{width:100%;height:auto;aspect-ratio:5/3;border-radius:12px;display:block;}
.rl-hero-body h2{margin:0;font-family:'Baloo 2',Roboto,Arial,sans-serif;font-size:24px;color:var(--navy);line-height:1.15;text-wrap:balance;}
.rl-hero-body p{margin:4px 0 10px;color:var(--muted);}
@media(max-width:480px){.rl-hero{grid-template-columns:1fr;text-align:center;}.rl-hero-canvas{max-width:240px;margin:0 auto;}.rl-hero-body .rl-btn{width:100%;}}

.rl-card{margin:10px 0;border-radius:12px;padding:12px 16px;background:var(--soft);border:1px solid var(--softline);font-size:13px;}
.rl-card h3{margin:0 0 4px;font-family:'Baloo 2',Roboto,Arial,sans-serif;font-size:18px;color:var(--navy);}
.rl-card p{margin:0 0 4px;} .rl-card p:last-child{margin:0;}
.rl-card.sand{background:var(--sand);border-color:#e0dccf;color:#4f4a3f;}

/* map: worlds */
.rl-world{margin:14px 0;border-radius:16px;padding:12px;border:1px solid var(--line);}
.rl-world-meadow{background:linear-gradient(180deg,#f1faec,#fff);}
.rl-world-hills{background:linear-gradient(180deg,#eef6fb,#fff);}
.rl-world-pond{background:linear-gradient(180deg,#e7f6fb,#fff);}
.rl-world-canyon{background:linear-gradient(180deg,#fdf0e6,#fff);}
.rl-world-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 2px 8px;}
.rl-world-head h3{margin:0;font-family:'Baloo 2',Roboto,Arial,sans-serif;font-size:20px;color:var(--navy);}
.rl-world-head span{font-size:12px;color:var(--muted);}
.rl-levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
@media(max-width:620px){.rl-levels{grid-template-columns:repeat(3,1fr);}}
@media(max-width:380px){.rl-levels{grid-template-columns:repeat(2,1fr);}}
.rl-level{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 9px;cursor:pointer;color:var(--ink);min-height:92px;}
.rl-level:hover{border-color:var(--blue);}
.rl-level .rl-lnum{font-family:'Baloo 2',Roboto,Arial,sans-serif;font-size:18px;color:var(--dblue);line-height:1;}
.rl-level .rl-lname{font-size:12px;font-weight:700;line-height:1.2;color:var(--navy);}
.rl-level .rl-lstars{font-size:12px;color:#c99700;letter-spacing:1px;}
.rl-level.is-locked{background:#f9f8f5;}
.rl-level.is-locked .rl-lnum,.rl-level.is-locked .rl-lname{color:#8a8578;}
.rl-level.is-next{border:2px solid var(--dpink);box-shadow:0 4px 12px rgba(224,127,163,.25);}
.rl-chip{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;background:var(--sand);color:#5f5a4d;border:1px solid #e0dccf;margin-top:auto;}
.rl-chip.free{background:var(--lgreen);color:var(--green);border-color:#a9d59a;}
.rl-chip.owned{background:var(--soft);color:var(--dblue);border-color:var(--softline);}
.rl-chip.today{background:var(--dpink);color:#fff;border-color:var(--dpink);}
.rl-chip.locked{background:#fff;color:#6d6656;}
.rl-chip.next{background:#fff;color:var(--dblue);border-color:var(--dblue);}
.rl-chip.done{background:var(--green);color:#fff;border-color:var(--green);}
.rl-chip.mastery{background:var(--gold);color:#5b4700;border-color:#e8bd4a;}

/* map: pellet locker */
.rl-locker{margin:16px 0;border-radius:16px;padding:12px;border:1px solid var(--line);background:#fff;}
.rl-locker h3{margin:0;font-family:'Baloo 2',Roboto,Arial,sans-serif;font-size:20px;color:var(--navy);}
.rl-skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:8px;}
.rl-skin{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 6px;cursor:pointer;color:var(--ink);text-align:center;}
.rl-skin:hover{border-color:var(--blue);}
.rl-skin.is-chosen{border:2px solid var(--dpink);background:#fdf3f7;}
.rl-skin.is-locked .rl-swatch{filter:grayscale(.75) opacity(.55);}
.rl-swatch{width:42px;height:42px;display:block;}
.rl-swatch.big{width:84px;height:84px;margin:4px auto;}
.rl-skin-name{font-size:12px;font-weight:700;color:var(--navy);}
.rl-skin-how{font-size:11px;color:var(--muted);line-height:1.25;}

/* level screen */
.rl-levelhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.rl-levelhead h2{margin:0;font-family:'Baloo 2',Roboto,Arial,sans-serif;font-size:24px;color:var(--navy);line-height:1.1;}
.rl-lnum{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.rl-levelhead .rl-lnum{display:block;}
.rl-objective{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 12px 8px 8px;margin-bottom:10px;}
.rl-guide{flex:0 0 52px;width:52px;height:52px;border-radius:50%;background:#fde7ef;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.rl-guide canvas{width:52px;height:52px;}
.rl-guide.happy{animation:rlHop .6s 2;}
.rl-guide.puzzled{animation:rlTilt .7s 1;}
@keyframes rlHop{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
@keyframes rlTilt{0%,100%{transform:rotate(0);}30%{transform:rotate(-10deg);}70%{transform:rotate(8deg);}}
.rl-bubble{flex:1;font-size:14px;}
.rl-bubble .rl-who{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:2px;}

.rl-scene-wrap{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--softline);background:#e8f4fb;touch-action:none;}
.rl-scene{display:block;width:100%;height:auto;touch-action:none;-webkit-user-select:none;user-select:none;}
.rl-scene.grabbing{cursor:grabbing;}

.rl-tray{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 4px;}
.rl-tray-btn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:6px;color:var(--ink);}
.rl-tray-btn:hover{border-color:var(--blue);}
.rl-tray-btn[aria-pressed="true"]{border-color:var(--dpink);background:#fde4ec;}
.rl-tray-btn:disabled{opacity:.4;cursor:default;}
.rl-tray-btn small{font-weight:400;color:var(--muted);}
.rl-ico{width:26px;height:14px;display:inline-block;border-radius:4px;}
.rl-ico-ramp{background:linear-gradient(170deg,transparent 42%,#d9a466 44%,#b07a44 70%,transparent 72%);}
.rl-ico-bouncer{background:radial-gradient(ellipse at 50% 100%,#ff6f8f 55%,transparent 57%);}
.rl-ico-block{background:linear-gradient(#b8ab9f,#7d7064);height:10px;}
.rl-ico-fan{background:radial-gradient(circle at 30% 50%,#009CDE 30%,#045C82 32%,#045C82 42%,transparent 44%);}
.rl-tools{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0;min-height:36px;}
.rl-tools .rl-btn{padding:6px 12px;min-height:38px;font-size:12px;}
.rl-toolname{align-self:center;font-size:12px;color:var(--muted);}
.rl-controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 6px;}
.rl-controls .rl-btn.run{background:var(--green);color:#fff;border-color:var(--green);padding:12px 30px;font-size:15px;}
.rl-controls .rl-btn.run:hover{background:#2f6b1c;}

.rl-message{text-align:center;min-height:24px;font-size:14px;font-weight:700;margin:6px 0;}
.rl-diag{margin:10px 0;border-radius:12px;padding:12px 14px;background:#fff3f5;border:1px solid #f4c6d3;font-size:14px;}
.rl-diag p{margin:0 0 6px;} .rl-diag p:last-child{margin:0;}
.rl-diag strong{color:var(--navy);}
.rl-journey{color:var(--muted);font-size:13px;}
.rl-hint{color:#1474aa;}

.rl-success{margin:12px 0;border-radius:16px;padding:16px;background:#fff;border:2px solid var(--lgreen);}
.rl-success h3{margin:0 0 10px;font-family:'Baloo 2',Roboto,Arial,sans-serif;font-size:26px;color:var(--dblue);text-align:center;}
.rl-stars{color:#c99700;letter-spacing:2px;}
.rl-eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dblue);margin:0 0 4px;}
.rl-journey-card{background:var(--soft);border:1px solid var(--softline);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:14px;}
.rl-journey-card p{margin:0 0 4px;} .rl-journey-card p:last-child{margin:0;}
.rl-facts{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
.rl-lesson{background:#f1faec;border:1px solid #cfe8c3;border-radius:12px;padding:10px 14px;font-size:14px;}
.rl-lesson p{margin:0 0 4px;}
.rl-lesson .rl-eyebrow{color:var(--green);}
.rl-lesson ul{margin:6px 0 0 1.1em;padding:0;font-size:13px;color:#33412f;}
.rl-lesson li{margin:0 0 3px;}
.rl-reward{margin:8px 0 0;color:var(--green);font-weight:700;text-align:center;}

.rl-challenges{margin:12px 0;font-size:13px;}
.rl-challenges h4,.rl-shelf h4{margin:0 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.rl-challenge{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--line);}
.rl-cstar{color:#c99700;font-size:16px;line-height:1.1;}
.rl-challenge.earned em{color:var(--green);font-style:normal;font-weight:700;}

.rl-shelf{margin:10px 0;}
.rl-shelf-items{display:flex;flex-wrap:wrap;gap:6px;}
.rl-shelf-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 4px 4px 10px;font-size:12px;display:inline-flex;gap:6px;align-items:center;}
.rl-shelf-item button{border:0;background:transparent;color:var(--dblue);font-weight:700;cursor:pointer;font-size:12px;padding:8px;min-height:36px;}

/* overlay: unlock and skin dialogs */
.rl-overlay{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(9,32,48,.55);opacity:0;transition:opacity .25s ease;pointer-events:none;padding:16px;}
.rl-overlay.show{opacity:1;pointer-events:auto;}
.rl-modal{position:relative;background:#fff;border-radius:20px;padding:22px 24px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.28);max-width:440px;width:100%;max-height:92vh;overflow:auto;font-size:14px;color:var(--ink);}
.rl-modal h3{font-family:'Baloo 2',Roboto,Arial,sans-serif;font-size:clamp(22px,6vw,28px);color:var(--dblue);font-weight:700;line-height:1.15;margin:0 0 6px;}
.rl-modal p{margin:6px 0;}
.rl-modal .rl-sub{color:var(--green);font-weight:700;}
.rl-modal ul{text-align:left;margin:8px 0 8px 1.1em;padding:0;font-size:13px;}
.rl-keys{display:inline-block;background:var(--sand);border:1px solid #e0dccf;border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px;margin:6px 0;}

.rl-foot{margin-top:18px;color:var(--muted);font-size:13px;}
.rl-foot summary{cursor:pointer;font-weight:700;color:var(--dblue);min-height:32px;}
.rl-foot p{margin:6px 0;}
.rl-exit{text-align:center;margin-top:10px;font-size:13px;}
.rl-exit a{color:var(--dblue);font-weight:700;}

@media(prefers-reduced-motion:reduce){#rl-game *,.rl-overlay,.rl-overlay *{animation:none!important;transition:none!important;}}
@media(max-width:420px){
  #rl-game{padding:16px 16px 40px;font-size:14px;}
  .rl-controls .rl-btn.run{flex:1 1 100%;}
}

</style>
<div class="rl-root" id="rl-game"><noscript>STEM-a-lotl: Rescue Lab needs JavaScript turned on to play.</noscript></div>
<script>window.AscendRL = {"preview":true,"loggedIn":false,"hubUrl":"https://ascendstemacademy.com/user/","loginUrl":"https://ascendstemacademy.com/login/","mascotUrl":"https://ascendstemacademy.com/wp-content/uploads/2026/09/stem-a-lotl-scientist-sticker.png","mascotHappyUrl":"https://ascendstemacademy.com/wp-content/uploads/2026/09/lucas-axolotl-wink.png"};</script>
<script>
/* STEM-a-lotl: Rescue Lab — the 40 authored puzzles.
 *
 * Every puzzle is a journey: a food pellet leaves the dispenser and must reach
 * Lucas the axolotl. Four worlds of ten, one new idea at a time:
 *   Meadow (ramps, bouncers, gravity) · Windy Hills (wind, fans, bees)
 *   Pond (water, currents, fish, bubbles) · Waterfall Canyon (falls + everything)
 *
 * Scene units: 100 wide x 60 tall, y grows downward, ground at y = 56.
 * Shared by the game, the preview and the tests (tests/solutions.json holds a
 * verified reference solution for every puzzle and every challenge).
 * Text fields can be overridden per site through the ascend_rl_level_text
 * option (see the plugin), without touching the physics.
 */
(function (root, factory) {
  if (typeof module !== 'undefined' && module.exports) module.exports = factory();
  else root.AscendRLLevels = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var GROUND = 56;

  /* ---- terrain helpers: each adds collision segments and a drawable fill ---- */
  function seg(x1, y1, x2, y2, mat) { return { x1: x1, y1: y1, x2: x2, y2: y2, mat: mat || 'grass' }; }
  function S(theme) { return { theme: theme, solids: [], fills: [], rocks: [], wind: [], water: [], falls: [], bugs: [], fish: [], bubbles: [] }; }
  function ground(s, x1, x2, mat) {
    mat = mat || (s.theme === 'canyon' ? 'rock' : 'grass');
    s.solids.push(seg(x1, GROUND, x2, GROUND, mat));
    s.fills.push({ shape: 'rect', x: x1, y: GROUND, w: x2 - x1, h: 8, mat: mat });
    return s;
  }
  function ledge(s, x1, x2, y, mat) {
    mat = mat || (s.theme === 'canyon' ? 'rock' : 'grass');
    s.solids.push(seg(x1, y, x2, y, mat), seg(x1, y, x1, GROUND, mat), seg(x2, y, x2, GROUND, mat));
    s.fills.push({ shape: 'rect', x: x1, y: y, w: x2 - x1, h: GROUND - y + 8, mat: mat });
    return s;
  }
  function slab(s, x1, x2, y1, y2, mat) {
    mat = mat || 'rock';
    s.solids.push(seg(x1, y1, x2, y1, mat), seg(x1, y2, x2, y2, mat), seg(x1, y1, x1, y2, mat), seg(x2, y1, x2, y2, mat));
    s.fills.push({ shape: 'rect', x: x1, y: y1, w: x2 - x1, h: y2 - y1, mat: mat });
    return s;
  }
  function hill(s, x1, y1, x2, y2, mat) {
    mat = mat || 'grass';
    s.solids.push(seg(x1, y1, x2, y2, mat));
    if (y1 < GROUND) s.solids.push(seg(x1, y1, x1, GROUND, mat));
    if (y2 < GROUND) s.solids.push(seg(x2, y2, x2, GROUND, mat));
    s.fills.push({ shape: 'poly', pts: [[x1, y1], [x2, y2], [x2, GROUND + 8], [x1, GROUND + 8]], mat: mat });
    return s;
  }
  function pillar(s, x, y, w, mat) { return ledge(s, x - (w || 4) / 2, x + (w || 4) / 2, y, mat || 'rock'); }
  function pond(s, x1, x2, surface, current) { s.water.push({ x: x1, y: surface, w: x2 - x1, h: GROUND - surface, current: current || 0 }); return s; }
  function bed(s, x1, x2) { return ground(s, x1, x2, 'sand'); }
  function falls(s, x1, x2, top) { s.falls.push({ x: x1, y: top || 0, w: x2 - x1, h: GROUND - (top || 0) }); return s; }
  function wind(s, x, y, w, h, fx, gust, fy) { s.wind.push({ x: x, y: y, w: w, h: h, fx: fx, fy: fy || 0, gust: gust || 0 }); return s; }
  function bee(s, x, y, ax, ay, period, phase) { s.bugs.push({ x: x, y: y, ax: ax, ay: ay, period: period, phase: phase || 0 }); return s; }
  function fish(s, x, y, range, period, phase) { s.fish.push({ x: x, y: y, range: range, period: period, phase: phase || 0 }); return s; }
  function rock(s, x, y, r) { s.rocks.push({ x: x, y: y, r: r }); return s; }
  function bubbles(s, x1, x2, top, fy) { s.bubbles.push({ x: x1, y: top, w: x2 - x1, h: GROUND - top, fy: fy }); return s; }
  function at(s, spawn, lucas, extra) {
    s.spawn = { x: spawn[0], y: spawn[1] };
    s.lucas = { x: lucas[0], y: lucas[1], face: lucas[2] || -1 };

  }

  function wind(c, scene, t) {
    (scene.wind || []).forEach(function (z, zi) {
      var w = Engine.windAt(z, t), dir = w.fx >= 0 ? 1 : -1, strength = Math.min(1, Math.abs(w.fx) / 45);
      c.fillStyle = 'rgba(255,255,255,.10)'; c.fillRect(z.x, z.y, z.w, z.h);
      c.strokeStyle = 'rgba(255,255,255,' + (0.45 + 0.35 * strength) + ')'; c.lineWidth = 0.4; c.lineCap = 'round';

    });
  }

  function rocks(c, scene) {
    (scene.rocks || []).forEach(function (r) {
      var g = c.createRadialGradient(r.x - r.r * 0.3, r.y - r.r * 0.4, r.r * 0.2, r.x, r.y, r.r);
      var mossy = (scene.theme === 'meadow' || scene.theme === 'hills');

    });
  }

  function bees(c, scene, t, showPath) {

      }

  }

  function fishes(c, scene, t) {
    (scene.fish || []).forEach(function (f, i) {
      var p = Engine.fishAt(f, t), wag = Math.sin(t * 10 + i) * 0.35;
      var colors = [['#ff9b4a', '#e2671b'], ['#ffc34a', '#d18a00'], ['#ff7a8a', '#c9435a']][i % 3];

      var g = c.createLinearGradient(0, -1.5, 0, 1.5); g.addColorStop(0, colors[0]); g.addColorStop(1, colors[1]);

      c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.moveTo(-0.6, -1.4); c.quadraticCurveTo(0.4, -2.4, 1, -1.3); c.fill();

      c.fillStyle = '#24332a'; c.beginPath(); c.arc(1.65, -0.35, 0.28, 0, TAU); c.fill();

  /* The food dispenser hangs from the top edge: a pipe down to a nozzle. */
  function dispenser(c, spawn) {
    var x = spawn.x, y = spawn.y, top = Math.max(0, y - 3.2);
    c.fillStyle = '#045C82'; rr(c, x - 1.6, -1, 3.2, top + 1, 0.6); c.fill();
    c.fillStyle = '#009CDE'; c.fillRect(x - 1.6, -1, 0.9, top + 1);
    c.fillStyle = '#045C82'; c.beginPath(); c.moveTo(x - 3, top); c.lineTo(x + 3, top); c.lineTo(x + 2, top + 1.2); c.lineTo(x - 2, top + 1.2); c.closePath(); c.fill();
    c.fillStyle = '#F5B9CF'; for (var i = 0; i < 3; i++) { c.beginPath(); c.arc(x - 1.6 + i * 1.6, top + 0.5, 0.4, 0, TAU); c.fill(); }
    c.fillStyle = 'rgba(255,255,255,.85)'; rr(c, x + 2.6, 0.6, 7.4, 3.2, 1.2); c.fill();
    label(c, 'Food', x + 6.3, 2.25, 2.1, '#045C82');
  }

  /* ------------------------------------------------------------- parts */
  function part(c, p, t, opts) {
    opts = opts || {};
    if (p.type === 'fan') return fan(c, p, t, opts);
    var s = Engine.partSegments(p)[0], ang = Math.atan2(s.y2 - s.y1, s.x2 - s.x1), len = Math.hypot(s.x2 - s.x1, s.y2 - s.y1);
    c.save(); c.translate(p.x, p.y); c.rotate(ang);
    if (p.type === 'ramp') {
      // wooden plank: the pellet rolls on its top surface, which is the physics line
      var g = c.createLinearGradient(0, -0.2, 0, 1.8); g.addColorStop(0, '#e2b173'); g.addColorStop(1, '#b07a44');
      c.fillStyle = g; rr(c, -len / 2, -0.2, len, 2, 0.6); c.fill();
      c.strokeStyle = 'rgba(110,70,35,.45)'; c.lineWidth = 0.18;
      for (var k = 0; k < 3; k++) { c.beginPath(); c.moveTo(-len / 2 + 0.8, 0.35 + k * 0.5); c.bezierCurveTo(-len / 6, 0.2 + k * 0.5, len / 6, 0.6 + k * 0.5, len / 2 - 0.8, 0.35 + k * 0.5); c.stroke(); }
      c.fillStyle = '#8a5a2b'; c.beginPath(); c.arc(-len / 2 + 1, 0.8, 0.28, 0, TAU); c.arc(len / 2 - 1, 0.8, 0.28, 0, TAU); c.fill();

      c.strokeStyle = '#8a5a2b'; c.lineWidth = 0.5; c.beginPath(); c.moveTo(-len / 4, 1.8); c.lineTo(-len / 4, 2.8); c.moveTo(len / 4, 1.8); c.lineTo(len / 4, 2.8); c.stroke();
    } else if (p.type === 'bouncer') {
      // a springy mushroom cap on a coil
      c.strokeStyle = '#8fa3ad'; c.lineWidth = 0.35; c.beginPath();
      for (k = 0; k <= 8; k++) { var zx = -len / 2 + 1.5 + k * (len - 3) / 8; c.lineTo(zx, 1.2 + (k % 2) * 1.3); }
      c.stroke();
      c.fillStyle = '#6b7f8a'; rr(c, -len / 2 + 1, 2.4, len - 2, 0.9, 0.4); c.fill();
      var cg = c.createLinearGradient(0, -1.4, 0, 1.2); cg.addColorStop(0, '#ff6f8f'); cg.addColorStop(1, '#c9435a');
      c.fillStyle = cg; c.beginPath(); c.moveTo(-len / 2, 1); c.quadraticCurveTo(0, -2.6, len / 2, 1); c.closePath(); c.fill();
      c.fillStyle = '#fff'; [[-3, 0], [0, -0.8], [3, 0]].forEach(function (d) { c.beginPath(); c.arc(d[0], d[1], 0.55, 0, TAU); c.fill(); });
    } else if (p.type === 'block') {
      var bg = c.createLinearGradient(0, -0.2, 0, 3); bg.addColorStop(0, '#b8ab9f'); bg.addColorStop(1, '#7d7064');
      c.fillStyle = bg; rr(c, -len / 2, -0.2, len, 3, 0.7); c.fill();
      c.strokeStyle = 'rgba(60,45,30,.35)'; c.lineWidth = 0.2; c.beginPath(); c.moveTo(-1, -0.2); c.lineTo(-0.3, 1.2); c.lineTo(-1.2, 2.8); c.moveTo(2.4, 0.4); c.lineTo(3.2, 1.8); c.stroke();
    }
    if (opts.selected) { c.strokeStyle = '#ffd166'; c.lineWidth = 0.6; rr(c, -len / 2 - 0.8, -1.4, len + 1.6, 4.8, 1.4); c.stroke(); }
    c.restore();

      // rotate handle at the right end
      c.fillStyle = '#ffd166'; c.strokeStyle = '#173e63'; c.lineWidth = 0.35; c.beginPath(); c.arc(s.x2, s.y2, 2, 0, TAU); c.fill(); c.stroke();
      c.beginPath(); c.arc(s.x2, s.y2, 1, 0.5, 5.3); c.stroke();
      label(c, (p.angle || 0) + '°', p.x, p.y - 4.2, 2.4, '#173e63');
    }
  }

  function fan(c, p, t, opts) {
    var z = Engine.fanZone(p), dx = Math.sign(z.fx), dy = Math.sign(z.fy);
    c.fillStyle = 'rgba(0,156,222,.08)'; c.fillRect(z.x, z.y, z.w, z.h);
    c.strokeStyle = 'rgba(0,156,222,.45)'; c.lineWidth = 0.35; c.lineCap = 'round';
    for (var i = 0; i < 4; i++) {
      var prog = ((t * 1.6 + i / 4) % 1), along = prog * (dx ? z.w : z.h);
      var ax = dx ? (dx > 0 ? z.x + along : z.x + z.w - along) : z.x + 2 + i * (z.w - 4) / 3;
      var ay = dy ? (dy > 0 ? z.y + along : z.y + z.h - along) : z.y + 2 + i * (z.h - 4) / 3;
      c.beginPath(); c.moveTo(ax - dx * 2, ay - dy * 2); c.lineTo(ax + dx * 2, ay + dy * 2); c.stroke();
      c.beginPath(); c.moveTo(ax + dx * 2, ay + dy * 2); c.lineTo(ax + dx * 1 - dy * 0.8, ay + dy * 1 + dx * 0.8); c.moveTo(ax + dx * 2, ay + dy * 2); c.lineTo(ax + dx * 1 + dy * 0.8, ay + dy * 1 - dx * 0.8); c.stroke();
    }
    c.save(); c.translate(p.x, p.y);
    c.fillStyle = '#045C82'; c.beginPath(); c.arc(0, 0, 3.4, 0, TAU); c.fill();
    c.fillStyle = '#e8f6fc'; c.beginPath(); c.arc(0, 0, 2.8, 0, TAU); c.fill();
    c.rotate(t * 14);
    c.fillStyle = '#009CDE'; for (i = 0; i < 4; i++) { c.rotate(TAU / 4); ellipse(c, 1.3, 0, 1.3, 0.6, 0.3); c.fill(); }
    c.fillStyle = '#045C82'; c.beginPath(); c.arc(0, 0, 0.6, 0, TAU); c.fill();
    c.restore();
    // direction nub
    c.fillStyle = '#E07FA3'; c.beginPath(); c.arc(p.x + dx * 3.6, p.y + dy * 3.6, 0.8, 0, TAU); c.fill();
    if (opts.selected) { c.strokeStyle = '#ffd166'; c.lineWidth = 0.6; c.beginPath(); c.arc(p.x, p.y, 4.4, 0, TAU); c.stroke(); }
  }

  /* ------------------------------------------------------------ pellet */
  function pellet(c, b, skin, t) {
    var r = b.r, col = skin.colors;
    c.fillStyle = 'rgba(0,0,0,.12)'; ellipse(c, b.x + 0.3, b.y + r * 0.9, r * 0.9, r * 0.3); c.fill();
    var g = c.createRadialGradient(b.x - r * 0.35, b.y - r * 0.4, r * 0.15, b.x, b.y, r);
    g.addColorStop(0, col[0]); g.addColorStop(1, col[1]);
    c.save(); c.beginPath(); c.arc(b.x, b.y, r, 0, TAU); c.fillStyle = g; c.fill(); c.clip();
    c.translate(b.x, b.y); c.rotate(b.angle || 0);
    patterns[skin.pattern] && patterns[skin.pattern](c, r, t, col);
    c.restore();
    c.fillStyle = 'rgba(255,255,255,.6)'; ellipse(c, b.x - r * 0.38, b.y - r * 0.42, r * 0.34, r * 0.22, -0.5); c.fill();
    c.strokeStyle = 'rgba(0,0,0,.12)'; c.lineWidth = 0.15; c.beginPath(); c.arc(b.x, b.y, r, 0, TAU); c.stroke();
  }
  var patterns = {
    plain: function (c, r) { c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 0.3; c.beginPath(); c.moveTo(-r, 0); c.lineTo(r, 0); c.stroke(); },
    dots: function (c, r) { c.fillStyle = 'rgba(255,255,255,.55)'; [[-0.8, -0.6], [0.7, 0.4], [-0.2, 1], [0.9, -0.9]].forEach(function (d) { c.beginPath(); c.arc(d[0], d[1], 0.32, 0, TAU); c.fill(); }); },
    swirl: function (c, r) { c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 0.3; c.beginPath(); for (var a = 0; a < 12; a += 0.3) c.lineTo(Math.cos(a) * a * 0.16, Math.sin(a) * a * 0.16); c.stroke(); },
    petals: function (c, r) { c.fillStyle = 'rgba(255,255,255,.45)'; for (var i = 0; i < 6; i++) { c.rotate(TAU / 6); ellipse(c, 1.2, 0, 0.8, 0.35); c.fill(); } c.fillStyle = '#8a5a2b'; c.beginPath(); c.arc(0, 0, 0.5, 0, TAU); c.fill(); },
    stripes: function (c, r) { c.fillStyle = 'rgba(255,255,255,.35)'; for (var i = -2; i <= 2; i++) c.fillRect(i * 1.1 - 0.25, -r, 0.5, r * 2); },
    bubbles: function (c, r) { c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 0.2; [[-0.7, -0.4, 0.5], [0.8, 0.5, 0.4], [0, 1.1, 0.3]].forEach(function (d) { c.beginPath(); c.arc(d[0], d[1], d[2], 0, TAU); c.stroke(); }); },
    cracks: function (c, r, t) { c.strokeStyle = 'rgba(255,200,80,' + (0.6 + 0.3 * Math.sin(t * 4)) + ')'; c.lineWidth = 0.28; c.beginPath(); c.moveTo(-1.6, -0.6); c.lineTo(-0.3, 0.1); c.lineTo(0.4, -0.9); c.moveTo(-0.3, 0.1); c.lineTo(0.8, 1.2); c.stroke(); },
    rainbow: function (c, r) { ['#ff6f8f', '#ffb347', '#ffe27a', '#8fdc7a', '#7bd3ff', '#a98bff'].forEach(function (col, i) { c.fillStyle = col; c.fillRect(-r, -r + i * (2 * r / 6), 2 * r, 2 * r / 6 + 0.05); }); },
    shine: function (c, r, t) { c.fillStyle = 'rgba(255,255,255,.35)'; c.rotate(t * 0.8); c.fillRect(-r, -0.35, 2 * r, 0.7); },
    stars: function (c, r) { c.fillStyle = '#fff'; [[-0.8, -0.5, 0.22], [0.9, 0.3, 0.18], [0.1, 1.1, 0.15], [0.4, -1.1, 0.12], [-1.2, 0.8, 0.12]].forEach(function (d) { c.beginPath(); c.arc(d[0], d[1], d[2], 0, TAU); c.fill(); }); },
    tiles: function (c, r) { c.strokeStyle = 'rgba(40,50,60,.35)'; c.lineWidth = 0.12; for (var i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(i * 0.9, -r); c.lineTo(i * 0.9, r); c.moveTo(-r, i * 0.9); c.lineTo(r, i * 0.9); c.stroke(); } c.fillStyle = 'rgba(255,255,255,.7)'; c.fillRect(-0.9, -0.9, 0.9, 0.9); }
  };

  function trail(c, pts, skin, t) {
    if (!skin.trail || !pts || pts.length < 2) return;
    var n = Math.min(pts.length, 14);
    for (var i = 0; i < n; i++) {
      var p = pts[pts.length - 1 - i], a = 1 - i / n;
      if (skin.trail === 'sparkle') { c.fillStyle = 'rgba(255,230,120,' + (a * 0.8) + ')'; var s = 0.5 * a + 0.2; c.beginPath(); c.moveTo(p[0], p[1] - s * 2); c.lineTo(p[0] + s * 0.5, p[1] - s * 0.5); c.lineTo(p[0] + s * 2, p[1]); c.lineTo(p[0] + s * 0.5, p[1] + s * 0.5); c.lineTo(p[0], p[1] + s * 2); c.lineTo(p[0] - s * 0.5, p[1] + s * 0.5); c.lineTo(p[0] - s * 2, p[1]); c.lineTo(p[0] - s * 0.5, p[1] - s * 0.5); c.closePath(); c.fill(); }
      else { c.strokeStyle = 'rgba(255,255,255,' + (a * 0.8) + ')'; c.lineWidth = 0.18; c.beginPath(); c.arc(p[0], p[1], 0.3 + i * 0.05, 0, TAU); c.stroke(); }
    }
  }

  /* ------------------------------------------------------------- Lucas */
  /**
   * Lucas the axolotl, drawn standing with his feet at (l.x, l.y).
   * mood: { t, open (0..1 mouth), chew (seconds since eating, or -1), sad }
   */
  function lucas(c, l, mood, underwater) {
    var t = mood.t || 0, f = l.face || -1, bob = underwater ? Math.sin(t * 2) * 0.4 : 0;
    c.save(); c.translate(l.x, l.y + bob); c.scale(-f, 1); // art is drawn facing left (-x)
    // shadow
    if (!underwater) { c.fillStyle = 'rgba(0,0,0,.12)'; ellipse(c, 0.5, -0.1, 7, 0.9); c.fill(); }
    // tail
    var sway = Math.sin(t * 2.2) * 0.8;
    c.fillStyle = '#f7a8c0'; c.beginPath(); c.moveTo(3, -3.6); c.quadraticCurveTo(7, -4.5 + sway, 10.2, -6 + sway); c.quadraticCurveTo(8, -2.6 + sway * 0.5, 3.4, -1.6); c.closePath(); c.fill();
    c.fillStyle = 'rgba(224,82,125,.25)'; c.beginPath(); c.moveTo(4, -3.8); c.quadraticCurveTo(7.4, -5.8 + sway, 10.2, -6 + sway); c.quadraticCurveTo(7, -4.5 + sway, 4, -3.2); c.fill();
    // back legs
    c.fillStyle = '#f39bb6'; ellipse(c, 2.6, -0.8, 1.1, 0.8, 0.4); c.fill(); ellipse(c, -2.2, -0.8, 1.1, 0.8, -0.3); c.fill();
    // body
    var bg = c.createLinearGradient(0, -6, 0, -1); bg.addColorStop(0, '#fbc3d3'); bg.addColorStop(1, '#f39bb6');
    c.fillStyle = bg; ellipse(c, 0.6, -3.2, 4.6, 2.5); c.fill();
    c.fillStyle = 'rgba(255,255,255,.35)'; ellipse(c, 0, -2.2, 3.4, 0.9); c.fill();
    // spots
    c.fillStyle = 'rgba(224,82,125,.25)'; [[1.8, -4.4], [3, -3.7], [0.4, -4.8]].forEach(function (s) { c.beginPath(); c.arc(s[0], s[1], 0.35, 0, TAU); c.fill(); });
    // head
    var hx = -3.2, hy = -6.2;
    var gills = Math.sin(t * 3) * 0.25;
    c.strokeStyle = '#e0527d'; c.lineCap = 'round'; c.lineWidth = 0.55;
    [[-0.6, -2.3, -1.1], [0.6, -2.6, -0.2], [1.8, -2.2, 0.7]].forEach(function (g, i) {
      var bx = hx + g[0], by = hy - 1.6, ex = hx + g[2] + 1.8 + gills * (i - 1), ey = hy + g[1] - 1.2 - Math.abs(gills);
      c.beginPath(); c.moveTo(bx, by); c.quadraticCurveTo((bx + ex) / 2 + 0.6, (by + ey) / 2, ex, ey); c.stroke();

  /* ------------------------------------------------------- unlock flow */
  /* Keys open puzzles in order: the dialog always offers the next puzzle in
     line, even when the child tapped one further ahead. */
  Game.prototype.openUnlock = function (tapped) {
    var self = this, m = el('div', 'rl-modal'), cost = CONFIG.keyCost, nl = Progress.nextLocked(store.access), lvl = nl || tapped;
    var html = '';
    if (nl && tapped.id !== nl.id) html += '<p class="rl-fine">Puzzles open in order. Puzzle ' + tapped.id + ' opens after puzzle ' + nl.id + '.</p>';
    html += '<h3>Puzzle ' + lvl.id + ': ' + esc(lvl.name) + '</h3><p class="rl-sub">' + esc(lvl.intro) + '</p>' +
      '<ul><li><strong>Idea:</strong> ' + esc(lvl.idea) + '</li><li><strong>Tools:</strong> ' + esc(lvl.tray.map(function (t) { return trayLabel(t) + ' ×' + t.count; }).join(', ')) + '</li><li><strong>Included:</strong> the puzzle and both star challenges, replayable forever</li></ul>';
    if (CONFIG.dailyUnlock && nl) html += '<p class="rl-fine">This is the next puzzle in line. It opens free on your next day of play, or now with a Pond Key.</p>';
    var canUnlock = false;
    if (store.demo) { html += '<p class="rl-keys">Demo: ' + plural(cost, 'key') + ' · demo keys left: ' + store.keys + '</p><p class="rl-fine">Pretend keys. Nothing is bought in the preview.</p>'; canUnlock = store.keys >= cost; }
    else if (!CFG.loggedIn) html += '<p class="rl-keys">Cost: ' + plural(cost, 'Pond Key') + '</p><p class="rl-fine">Log in to the student account to use keys. A parent buys keys in the Ascend shop; they never expire.</p>';
    else if (!store.keysAvailable) html += '<p class="rl-fine">The key system is not reachable right now, so this puzzle cannot be opened with a key yet. Your progress is safe.</p>';
    else { html += '<p class="rl-keys">Cost: ' + plural(cost, 'Pond Key') + ' · You have ' + (store.keys == null ? '…' : store.keys) + (store.keys != null && store.keys >= cost ? ' → ' + (store.keys - cost) + ' after' : '') + '</p><p class="rl-fine">A key opens the next puzzle for good on this student account. Replaying never costs another key.</p>'; canUnlock = store.keys != null && store.keys >= cost; }
    m.innerHTML = html;
    var row = el('div', 'rl-row');
    if (!CFG.loggedIn && !CFG.preview) { var a = el('a', 'rl-btn pass', 'Log in'); a.href = CFG.loginUrl || '/login/'; row.appendChild(a); }
    else if (canUnlock && nl) {
      var label = 'Open puzzle ' + nl.id + ' with ' + plural(cost, 'key');
      var u = btn('rl-btn pass', label, function () {
        u.disabled = true; u.textContent = 'Opening…';
        authority.unlock(nl.id, function (res) {
          if (res.ok) { store.apply(res.body); store.saveLocal(); self.closeOverlay(); self.refreshHeader(); self.openLevel(nl.id); self.live.textContent = 'Puzzle ' + nl.id + ' is open for good.'; }
          else { u.disabled = false; u.textContent = label; m.appendChild(el('p', 'rl-fine', res.error === 'network' ? 'No connection. Nothing was spent. Try again when you are back online.' : res.error + ' No key was taken.')); }
        });
      });
      row.appendChild(u);
    } else if (!store.demo && store.keysAvailable) {
      if (CFG.buyUrl) { var b = el('a', 'rl-btn pass', 'Get a Pond Key (parent shop)'); b.href = CFG.buyUrl; row.appendChild(b); }
      if (CFG.passUrl) { var p = el('a', 'rl-btn', 'Full Pond Pass'); p.href = CFG.passUrl; row.appendChild(p); }
    }
    row.appendChild(btn('rl-btn', 'Not now', function () { self.closeOverlay(); }));
    m.appendChild(row);
    this.showOverlay(m);
  };

  Game.prototype.showOverlay = function (content) { this.overlay.innerHTML = ''; this.overlay.appendChild(content); this.overlay.classList.add('show'); var f = content.querySelector('button, a'); if (f) f.focus(); };

  /* ------------------------------------------------------------- level */
  Game.prototype.openLevel = function (levelId) {
    var lvl = Levels.LEVELS[levelId - 1];
    if (Progress.accessOf(lvl, store.access) === 'locked') { this.openUnlock(lvl); return; }
    this.stopSim();
    this.screen = 'level';
    this.level = lvl;
    this.spec = Engine.resolve(lvl);
    this.design = store.getDraft(lvl.id) || Engine.newDesign(this.spec);
    this.undo = []; this.selected = null; this.placing = null; this.lastRun = null; this.drag = null; this.finalSim = null; this.eatenAt = -1; this.recent = [];
    if (!this.failedRuns[lvl.id]) this.failedRuns[lvl.id] = 0;
    this.renderLevel();
    this.say(lvl.intro);
    this.live.textContent = '';
    this.startLoop();
  };

  Game.prototype.renderTray = function () {
    var self = this, spec = this.spec, tray = this.tray;
    tray.innerHTML = '';
    spec.tray.forEach(function (t) {
      var used = Engine.trayUsed(self.design, t.type, t.len), left = t.count - used, on = !!(self.placing && self.placing.type === t.type && self.placing.len === t.len);
      var b = btn('rl-tray-btn', '', function () { self.placing = on ? null : t; self.selected = null; self.renderTray(); self.renderTools(); self.draw(); self.setMessage(self.placing ? 'Tap the scene to place the ' + trayLabel(t).toLowerCase() + '.' : ''); });
      b.innerHTML = '<span class="rl-ico rl-ico-' + t.type + '" aria-hidden="true"></span> ' + esc(trayLabel(t)) + ' <small>×' + left + '</small>';
      b.disabled = left <= 0 || !!self.sim;
      b.setAttribute('aria-pressed', String(on));
      tray.appendChild(b);

  Game.prototype.renderTools = function () {
    var self = this, tools = this.tools;

    if (this.sim || this.selected == null) return;
    var p = this.design.parts[this.selected];
    if (!p) { this.selected = null; return; }
    tools.appendChild(el('span', 'rl-toolname', Engine.PART_SPEC[p.type].label + (p.angle != null ? ' · ' + p.angle + '°' : '')));
    if (p.angle != null) {
      tools.appendChild(btn('rl-btn', '↺ Tilt −15°', function () { self.pushUndo(); p.angle = clamp((p.angle || 0) - 15, -75, 75); self.afterEdit(); }));
      tools.appendChild(btn('rl-btn', '↻ Tilt +15°', function () { self.pushUndo(); p.angle = clamp((p.angle || 0) + 15, -75, 75); self.afterEdit(); }));

    }
    if (p.type === 'fan') tools.appendChild(btn('rl-btn', 'Turn fan (blows ' + ({ E: 'right', S: 'down', W: 'left', N: 'up' })[p.dir || 'E'] + ')', function () { self.pushUndo(); p.dir = { E: 'S', S: 'W', W: 'N', N: 'E' }[p.dir || 'E']; self.afterEdit(); }));
    tools.appendChild(btn('rl-btn', 'Remove', function () { self.pushUndo(); self.design.parts.splice(self.selected, 1); self.selected = null; self.afterEdit(); }));
  };

  Game.prototype.pushUndo = function () { this.undo.push(clone(this.design)); if (this.undo.length > 40) this.undo.shift(); };
  Game.prototype.doUndo = function () {
    if (this.sim) return;

    this.design = this.undo.pop(); this.selected = null; this.placing = null; this.afterEdit();
  };

  /* ------------------------------------------------------------ canvas */
  Game.prototype.sizeCanvas = function () {
    if (!this.canvas) return;
    var w = Math.max(260, this.sceneWrap.clientWidth || 600), h = Math.round(w * 0.6), dpr = window.devicePixelRatio || 1;
    this.canvas.style.width = w + 'px'; this.canvas.style.height = h + 'px';
    this.canvas.width = Math.round(w * dpr); this.canvas.height = Math.round(h * dpr);
    this.scale = w / 100; this.dpr = dpr;
  };
  Game.prototype.toScene = function (e) { var r = this.canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / this.scale, y: (e.clientY - r.top) / this.scale }; };

    this.raf = requestAnimationFrame(function (t) { self.frame(t); });
  };
  Game.prototype.stopLoop = function () { if (this.raf) { cancelAnimationFrame(this.raf); this.raf = null; } };

  /* One loop drives both ambient animation and runs. Frame time only
     decides how many fixed steps to take; it never changes an outcome. */
  Game.prototype.frame = function (now) {
    this.raf = null;
    if (this.screen !== 'level' || document.hidden) return;
    if (!this.lastFrame) this.lastFrame = now;
    var dt = Math.min(0.1, (now - this.lastFrame) / 1000); this.lastFrame = now;
    if (!REDUCED || this.sim) this.clock += dt;
    if (this.sim) {
      this.acc += dt;
      var running = true, before = this.sim.events.length;
      while (this.acc >= Engine.DT && running) { running = this.sim.step(); this.acc -= Engine.DT; }
      var b = this.sim.body; this.recent.push([b.x, b.y]); if (this.recent.length > 16) this.recent.shift();
      for (var i = before; i < this.sim.events.length; i++) this.sound(this.sim.events[i]);
      if (!running) this.finishRun();
      this.draw();
    } else this.draw();
    var self = this;
    if (this.sim || !REDUCED) this.raf = requestAnimationFrame(function (t) { self.frame(t); });
  };

  Game.prototype.sound = function (e) {
    if (e.type === 'boing') audio.boing(); else if (e.type === 'bounce') audio.bounce(); else if (e.type === 'splash') audio.splash(); else if (e.type === 'bump' && e.kind === 'bee') audio.buzz(); else if (e.type === 'bump') audio.bounce();
  };

  Game.prototype.draw = function () {
    if (!this.canvas || this.screen !== 'level') return;
    var c = this.canvas.getContext('2d');
    c.setTransform(this.dpr * this.scale, 0, 0, this.dpr * this.scale, 0, 0);
    c.clearRect(0, 0, 100, 60);
    var live = this.sim || this.finalSim, sc = this.spec.scene;
    var t = this.sim ? this.sim.t : (this.finalSim ? this.finalSim.t : (REDUCED ? 0 : this.clock));
    var body = live ? live.body : { x: sc.spawn.x, y: sc.spawn.y, r: Engine.PELLET_R, angle: 0 };
    var eaten = !!(this.finalSim && this.finalSim.result === 'success');
    var skin = Progress.skinById(store.progress.settings.skin) || Levels.SKINS[0];
    if (!Progress.skinState(store.progress, skin, store.ownedSkins).open) skin = Levels.SKINS[0];
    Art.scene(c, sc, {
      t: t, clock: this.clock, parts: this.design.parts, selected: this.selected, preview: this.placing && this.hover ? this.previewPart(this.hover) : null,
      ghost: !live && store.progress.settings.ghost ? this.ghost[this.level.id] : null, showPaths: !this.sim, showRing: !eaten,
      lucas: { t: this.clock, open: live && live.nearMouth && !eaten ? 0.9 : 0, chew: eaten ? this.clock - this.eatenAt : -1, sad: !!(this.finalSim && !eaten) },
      body: eaten ? null : body, skin: skin, recent: this.sim ? this.recent : null
    });
  };

  Game.prototype.previewPart = function (pt) {
    var t = this.placing, p = { type: t.type, x: Math.round(pt.x), y: Math.round(pt.y) };
    if (t.type === 'fan') p.dir = 'E';
    else { p.angle = t.type === 'ramp' ? 15 : 0; if (t.len) p.len = t.len; }
    return p;
  };

  /* --------------------------------------------------- pointer + keys */
  Game.prototype.bindPointer = function () {
    var self = this, cv = this.canvas;
    cv.addEventListener('pointerdown', function (e) { self.onDown(e); });
    cv.addEventListener('pointermove', function (e) { self.onMove(e); });
    cv.addEventListener('pointerup', function (e) { self.onUp(e); });
    cv.addEventListener('pointercancel', function (e) { self.onUp(e, true); });
    cv.addEventListener('pointerleave', function () { self.hover = null; });
    cv.addEventListener('keydown', function (e) { self.onKey(e); });
  };

  Game.prototype.onDown = function (e) {
    if (this.sim) return;
    e.preventDefault();
    var pt = this.toScene(e);
    try { this.canvas.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ }
    if (this.placing) {
      var lim = Engine.trayLimit(this.spec, this.placing.type, this.placing.len), used = Engine.trayUsed(this.design, this.placing.type, this.placing.len);
      if (used >= lim) { this.placing = null; this.renderTray(); return; }
      this.pushUndo(); var p = this.previewPart(pt); this.design.parts.push(p); this.selected = this.design.parts.length - 1;
      if (used + 1 >= lim) this.placing = null;
      audio.place(); this.afterEdit(); this.setMessage('Placed. Drag it to move, or drag the yellow handle to tilt.'); return;
    }
    var hit = this.hitPart(pt);
    if (hit != null) {
      var part = this.design.parts[hit];
      this.selected = hit;
      var s = Engine.partSegments(part)[0];
      var handle = part.angle != null && s && Math.hypot(pt.x - s.x2, pt.y - s.y2) < 3.4;
      this.pushUndo();
      this.drag = { kind: handle ? 'rotate' : 'move', idx: hit, ox: pt.x - part.x, oy: pt.y - part.y, moved: false };
      this.canvas.classList.add('grabbing'); this.renderTools(); this.draw();
    } else { this.selected = null; this.renderTools(); this.draw(); }
  };

  Game.prototype.onMove = function (e) {
    var pt = this.toScene(e); this.hover = pt;
    if (!this.drag) { if (this.placing && REDUCED) this.draw(); return; }
    e.preventDefault();
    var p = this.design.parts[this.drag.idx];
    if (this.drag.kind === 'rotate') { var a = Math.atan2(pt.y - p.y, pt.x - p.x) * 180 / Math.PI; p.angle = clamp(Math.round(a / 5) * 5, -75, 75); }
    else { p.x = clamp(pt.x - this.drag.ox, 2, 98); p.y = clamp(pt.y - this.drag.oy, 2, GROUND - 1); }
    this.drag.moved = true;
    if (REDUCED) this.draw();
  };

  Game.prototype.onUp = function (e, cancelled) {
    this.canvas.classList.remove('grabbing');
    if (!this.drag) return;
    var d = this.drag; this.drag = null;
    if (!d.moved) this.undo.pop();
    this.afterEdit();
    if (d.moved && !cancelled) this.setMessage(d.kind === 'rotate' ? 'Tilted to ' + this.design.parts[d.idx].angle + '°.' : 'Moved.');
  };

  Game.prototype.onKey = function (e) {
    if (this.sim) return;
    var p = this.selected != null ? this.design.parts[this.selected] : null, step = e.shiftKey ? 5 : 1, used = true;
    if (e.key === 'Enter') { e.preventDefault(); this.run(); return; }
    if (p && e.key === 'ArrowLeft') { this.pushUndo(); p.x = clamp(p.x - step, 2, 98); }
    else if (p && e.key === 'ArrowRight') { this.pushUndo(); p.x = clamp(p.x + step, 2, 98); }
    else if (p && e.key === 'ArrowUp') { this.pushUndo(); p.y = clamp(p.y - step, 2, GROUND - 1); }
    else if (p && e.key === 'ArrowDown') { this.pushUndo(); p.y = clamp(p.y + step, 2, GROUND - 1); }
    else if (p && p.angle != null && (e.key === '[' || e.key === ']')) { this.pushUndo(); p.angle = clamp(p.angle + (e.key === ']' ? 5 : -5), -75, 75); }
    else if (p && (e.key === 'Delete' || e.key === 'Backspace')) { this.pushUndo(); this.design.parts.splice(this.selected, 1); this.selected = null; }
    else if (e.key === 'n' || e.key === 'N') { if (this.design.parts.length) this.selected = ((this.selected == null ? -1 : this.selected) + 1) % this.design.parts.length; }
    else used = false;
    if (used) { e.preventDefault(); this.afterEdit(); }
  };

  Game.prototype.hitPart = function (pt) {
    var parts = this.design.parts || [], best = null, bestD = 4.5;
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      if (p.type === 'fan') { if (Math.hypot(pt.x - p.x, pt.y - p.y) < 5) return i; continue; }
      var s = Engine.partSegments(p)[0], dx = s.x2 - s.x1, dy = s.y2 - s.y1, l2 = dx * dx + dy * dy, t = l2 ? clamp(((pt.x - s.x1) * dx + (pt.y - s.y1) * dy) / l2, 0, 1) : 0;
      var d = Math.hypot(pt.x - (s.x1 + dx * t), pt.y - (s.y1 + dy * t));
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  };

  /* --------------------------------------------------------------- run */
  Game.prototype.run = function () {
    if (this.sim) return;
    var v = Engine.validateDesign(this.spec, this.design);
    if (!v.ok) { this.setMessage(v.issues[0]); return; }
    this.selected = null; this.placing = null;
    this.successBox.innerHTML = ''; this.diagBox.innerHTML = ''; this.finalSim = null; this.eatenAt = -1; this.recent = [];
    this.sim = Engine.createSim(this.spec, this.design);
    this.renderTray(); this.renderTools();
    this.runBtn.disabled = true; this.undoBtn.disabled = true; this.resetBtn.disabled = true;
    this.setMessage('Here goes the pellet…'); audio.run();
    this.acc = 0;
    this.stopLoop(); this.startLoop();
  };

  Game.prototype.stopSim = function () { this.sim = null; };

  Game.prototype.finishRun = function () {
    var sim = this.sim, spec = this.spec, lvl = this.level, self = this;
    this.sim = null; this.finalSim = sim;
    this.runBtn.disabled = false; this.undoBtn.disabled = false; this.resetBtn.disabled = false;
    var run = { ok: sim.result === 'success', result: sim.result, diag: sim.diag, t: sim.t, trail: sim.trail, events: sim.events, sim: sim };
    this.lastRun = run;
    this.ghost[lvl.id] = sim.trail;
    store.progress.runs++;
    this.renderTray(); this.renderTools();
    if (!run.ok) {
      store.progress.fails++; this.failedRuns[lvl.id]++;
      store.save();
      this.setMessage('Not yet. Your build is still here.');
      this.say(run.diag.text, 'puzzled'); audio.fail();
      this.renderDiag();
      return;
    }
    this.eatenAt = this.clock;
    var before = Progress.earnedSkinIds(store.progress, store.ownedSkins);
    var badges = [];
    lvl.challenges.forEach(function (ch) { if (Engine.checkRule(spec, self.design, run, ch.rule)) badges.push(ch.badge); });
    var wasDone = !!(store.progress.levels[lvl.id] && store.progress.levels[lvl.id].done);
    var prev = clone((store.progress.levels[lvl.id] || { badges: {} }).badges);
    Progress.recordSuccess(store.progress, lvl.id, badges, { time: run.t, parts: this.design.parts.length });
    var newSkins = Progress.earnedSkinIds(store.progress, store.ownedSkins).filter(function (id) { return before.indexOf(id) === -1; });
    store.save();
    this.refreshHeader();
    this.setMessage('Yum! Lucas ate it.'); this.say('Yum, thank you! ' + run.diag.text, 'happy'); audio.gulp();
    this.renderSuccess(run, badges, prev, wasDone, newSkins);
    this.renderChallenges(); this.renderShelf();
    try { this.root.dispatchEvent(new CustomEvent('ascend:game-complete', { bubbles: true, detail: { game: 'rescue-lab', level: lvl.id, badges: badges, time: run.t } })); } catch (e) { /* ignore */ }
  };

  Game.prototype.renderDiag = function () {
    var run = this.lastRun, box = this.diagBox, self = this;
    if (!box) return;
    box.innerHTML = '';
    if (!run || run.ok) return;
    var j = Engine.journey(run.sim);
    var d = el('div', 'rl-diag bad');
    d.innerHTML = '<p><strong>What happened:</strong> ' + esc(run.diag.text) + '</p><p class="rl-journey">' + esc(j.text) + '</p>' + (run.diag.hint ? '<p class="rl-hint">' + esc(run.diag.hint) + '</p>' : '');
    var row = el('div', 'rl-row left');
    row.appendChild(btn('rl-btn blue', '↻ Run again', function () { self.run(); }));
    if (store.progress.settings.assist && this.failedRuns[this.level.id] >= 2) row.appendChild(btn('rl-btn', 'Give me a nudge', function () { self.say(self.level.hint || self.nudge()); }));
    d.appendChild(row);
    box.appendChild(d);
  };

  Game.prototype.nudge = function () {
    var code = this.lastRun && this.lastRun.diag.code, sc = this.spec.scene;
    if (code === 'missed_part') return 'Put a part right under the food dispenser so the pellet lands on it.';
    if (code === 'too_fast' || code === 'overshot') return 'Too much speed. Make your ramp less steep, or start it lower.';
    if (code === 'stuck') return 'The pellet is resting on your part. Tilt the part more, maybe 20° or 30°.';
    if (code === 'swept') return 'Waterfalls pull straight down. Either cross them fast, or use them to drop onto Lucas.';
    if (code === 'bumped') return 'Watch the dotted line: that is where the bee goes. Change the pellet’s speed so they are not in the same place at the same time.';
    if (code === 'fell') return 'The pellet needs more sideways speed to cross the gap. A longer or steeper ramp helps.';
    if ((sc.wind || []).length) return 'Watch which way the wind blows. Let it carry the pellet toward Lucas, or push back with a fan.';
    if ((sc.water || []).length) return 'In water the pellet sinks slowly and drifts with the current. Drop it in upstream of Lucas.';
    return 'Change just one thing, run again, and compare with the ghost trail from last time.';
  };

  Game.prototype.renderSuccess = function (run, badges, prev, wasDone, newSkins) {
    var lvl = this.level, self = this, box = el('div', 'rl-success');
    var j = Engine.journey(run.sim), earned = Object.keys(store.progress.levels[lvl.id].badges).length;
    var fresh = badges.filter(function (b) { return !prev[b]; });
    var html = '<h3>' + (wasDone ? 'Yum, again!' : 'Lucas is fed!') + ' <span class="rl-stars" aria-label="' + earned + ' of 3 stars">' + starText(earned) + '</span></h3>' +
      '<div class="rl-journey-card"><p class="rl-eyebrow">The journey</p><p>' + esc(j.text) + '</p>' +
      '<p class="rl-facts">Top speed ' + j.topSpeed + ' units per second · longest time in the air ' + j.airtime + ' s</p></div>' +
      '<div class="rl-lesson"><p class="rl-eyebrow">The lesson</p><p>' + esc(lvl.lesson) + '</p>' +
      (j.notes.length ? '<ul>' + j.notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>' : '') + '</div>';
    if (fresh.length) html += '<p class="rl-reward">New star' + (fresh.length > 1 ? 's' : '') + ': ' + fresh.map(function (b) { var c = lvl.challenges.filter(function (x) { return x.badge === b; })[0]; return c ? esc(c.text.split(':')[0]) : esc(b); }).join(', ') + '</p>';
    newSkins.forEach(function (id) { var s = Progress.skinById(id); html += '<p class="rl-reward">New pellet unlocked: ' + esc(s.name) + '! Pick it in the pellet locker.</p>'; });
    box.innerHTML = html;
    var row = el('div', 'rl-row');
    var nextLvl = Levels.LEVELS[lvl.id] || null, nextOpen = nextLvl && Progress.accessOf(nextLvl, store.access) !== 'locked';
    if (nextLvl) row.appendChild(btn('rl-btn primary', nextOpen ? 'Next puzzle →' : 'Next puzzle (locked)', function () { self.openLevel(nextLvl.id); }));
    var untried = lvl.challenges.filter(function (c) { return !store.progress.levels[lvl.id].badges[c.badge]; })[0];
    if (untried) row.appendChild(btn('rl-btn blue', 'Try for a star', function () { self.successBox.innerHTML = ''; self.finalSim = null; self.eatenAt = -1; self.say('Star challenge: ' + untried.text); self.challengeBox.scrollIntoView({ block: 'nearest' }); }));
    row.appendChild(btn('rl-btn', 'Save design', function () {
      var lv = store.progress.levels[lvl.id], name = 'Design ' + ((lv.designs || []).length + 1) + ' · ' + run.t.toFixed(1) + ' s';
      Progress.saveDesign(store.progress, lvl.id, self.design, name, { time: Math.round(run.t * 100) / 100, parts: self.design.parts.length }, Date.now());
      store.save(); self.renderShelf(); self.setMessage('Saved to your inventions shelf.');
    }));
    row.appendChild(btn('rl-btn', 'Map', function () { self.showMap(); }));
    box.appendChild(row);
    this.successBox.innerHTML = ''; this.successBox.appendChild(box);
    this.diagBox.innerHTML = '';
  };

  Game.prototype.renderChallenges = function () {
    var lvl = this.level, box = this.challengeBox, lv = store.progress.levels[lvl.id] || { badges: {} };
    box.innerHTML = '<h4>Stars</h4>';
    [{ badge: 'rescue', text: 'Feed Lucas.' }].concat(lvl.challenges).forEach(function (c) {
      var d = el('div', 'rl-challenge' + (lv.badges[c.badge] ? ' earned' : ''));
      d.innerHTML = '<span class="rl-cstar" aria-hidden="true">' + (lv.badges[c.badge] ? '★' : '☆') + '</span><span>' + esc(c.text) + (lv.badges[c.badge] ? ' <em>Earned</em>' : '') + '</span>';
      box.appendChild(d);
    });
  };

  Game.prototype.renderShelf = function () {
    var lvl = this.level, box = this.shelfBox, self = this, lv = store.progress.levels[lvl.id];
    box.innerHTML = '';
    if (!lv || !lv.designs.length) return;
    box.appendChild(el('h4', null, 'Your inventions shelf'));
    var items = el('div', 'rl-shelf-items');
    lv.designs.forEach(function (d) {
      var it = el('span', 'rl-shelf-item');
      it.appendChild(el('span', null, d.name + ' · ' + plural(d.design.parts.length, 'part')));
      it.appendChild(btn(null, 'Load', function () { if (self.sim) return; self.pushUndo(); self.design = clone(d.design); self.afterEdit(); self.setMessage('Loaded. Run it or change it.'); }));
      items.appendChild(it);
    });
    box.appendChild(items);
  };

  /* --------------------------------------------------------------- init */
  function init() {
    store.loadLocal();
    var roots = document.querySelectorAll('.rl-root');
    for (var i = 0; i < roots.length; i++) if (!roots[i].__rl) roots[i].__rl = new Game(roots[i]);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
  window.AscendRescueLab = { store: store };
})();

</script>
